# Nginx : sert l'application Vue (frontend/dist) et transmet /api à Symfony (php-fpm).
# Adapter : nom du service php-fpm (php:9000) et chemins /var/www/...
server {
    listen 80;
    server_name _;

    root /var/www/frontend/dist;
    index index.html;

    # API Symfony
    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        # En HTTPS (production), décommenter :
        # fastcgi_param HTTPS on;
    }

    # Application Vue (routes côté client → index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
