# Ancien port HTTP : seules les lectures navigateur redirigent ;
# les requetes d'ecriture non chiffrees sont refusees.
server {
    listen 80;
    server_name localhost 127.0.0.1;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 308 https://localhost:8443$request_uri;
}

# Nginx : sert l'application Vue (frontend/dist) et transmet /api à Symfony (php-fpm).
# Adapter : nom du service php-fpm (php:9000) et chemins /var/www/...
server {
    listen 443 ssl;
    if ($host !~* "^(localhost|127\.0\.0\.1)$") { return 444; }
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_name _;

    root /var/www/frontend/dist;
    index index.html;

    # API Symfony
    location /api/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        # En HTTPS (production), décommenter :
        # fastcgi_param HTTPS on;
    }

    # Frontend Vue.js - Vue Router en mode history
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
