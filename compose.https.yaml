# GC-ATTINGUIE - HTTPS LOCAL UNIQUEMENT (Docker Compose >=2.24.4)
# Garder toutes les autres proprietes de la configuration d'origine.
services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
